<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>BENCH — Device Performance Benchmark</title>
    <meta
      name="description"
      content="BENCH misst die tatsächliche CPU- und GPU-Leistung von Smartphones, Tablets, Laptops und Desktop-PCs — lokal im Browser, ohne Installation und ohne Konto."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231d1d1f'/%3E%3Cpath d='M20 42V22h9.5c4.6 0 7.2 2.3 7.2 6 0 2.4-1.2 4.1-3.2 5 2.7.7 4.3 2.7 4.3 5.6 0 4-2.9 6.4-7.9 6.4H20Zm4.8-11.6h3.9c2.2 0 3.4-1 3.4-2.8 0-1.9-1.2-2.8-3.6-2.8h-3.7v5.6Zm0 8.3h4.5c2.4 0 3.7-1 3.7-3s-1.4-3-3.9-3h-4.3v6Z' fill='%23f5f5f7'/%3E%3C/svg%3E"
    />
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('bench.theme') || 'auto';
          var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved = mode === 'auto' ? (dark ? 'dark' : 'light') : mode;
          document.documentElement.dataset.theme = resolved;
          document.documentElement.dataset.themeMode = mode;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
